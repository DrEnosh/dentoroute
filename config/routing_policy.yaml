# DentoRoute routing policy v2 - CONSERVATIVE safety gate
#
# RESEARCH-DEMO THRESHOLDS ONLY. These are NOT clinical thresholds. They were not derived from clinical
# data, were not reviewed by clinicians, and must not be used for real triage.
#
# Rules (first match wins; see backend/services/routing_service.py):
#   R0 invalid/missing model output -> human review (fail-safe)
#   R1 human_review_probability high -> escalate to human
#   R2 infection_probability high -> urgent human review
#   R3 urgency score / P(URGENT or EMERGENCY) / same-day probability / learned risk score high -> urgent human review
#   R4 any confidence floor not met, or an uncertain safety answer -> human review
#   R5 specialty on human_only_specialties -> human review
#   R6 everything above passed -> automated specialty route
#
# Tunable thresholds can only move toward MORE caution: the hard ceilings/floors are in
# backend/services/policy_service.py (not here), and validate_policy() rejects anything looser.
# 'tuning' lists what scripts/tune_policy.py may change, on train+calibration data only (never the holdout).

version: 2
name: conservative
rules: conservative
disclaimer: Research-demo thresholds, not clinical thresholds.
thresholds:
  human_review_probability: 0.3
  infection_probability: 0.15
  same_day_probability: 0.5
  urgency_score: 1.5
  urgent_tail_probability: 0.3
  risk_score: 0.1
  urgency_confidence_min: 0.7
  specialty_confidence_min: 0.7
  specialty_top_probability_min: 0.55
  boolean_certainty_min: 0.5
human_only_specialties:
- emergency_dental_service
- oral_pathology
confidence_bands:
